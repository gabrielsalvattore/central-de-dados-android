workflows:
  central-de-dados-android:
    name: Central de Dados - APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extrair projeto Android
        script: |
         unzip -o App_Central_Dados.zip
      - name: Compilar APK
        script: |
          cd CentralDadosAndroid
          gradle assembleDebug --stacktrace
    artifacts:
      - CentralDadosAndroid/app/build/outputs/apk/debug/*.apk
